<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LOADSTRING FORMATTER BY YAJU</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem 1rem;
    }
    .container {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      width: 100%;
      max-width: 580px;
    }
    h1 {
      font-size: 20px;
      font-weight: 500;
      color: #a0c4ff;
      text-align: center;
    }
    .card {
      background: #16213e;
      border: 1px solid #0f3460;
      border-radius: 12px;
      padding: 1.5rem;
    }
    .label {
      font-size: 13px;
      color: #8888aa;
      margin-bottom: 8px;
    }
    .hint {
      font-size: 11px;
      color: #556080;
      margin-bottom: 10px;
    }
    textarea#url-input {
      width: 100%;
      font-family: monospace;
      font-size: 13px;
      background: #0f3460;
      border: 1px solid #1a5276;
      border-radius: 8px;
      padding: 10px 12px;
      color: #e0e0e0;
      outline: none;
      resize: vertical;
      min-height: 72px;
    }
    textarea#url-input:focus { border-color: #a0c4ff; }
    textarea#url-input::placeholder { color: #556080; }
    #run-btn {
      margin-top: 10px;
      width: 100%;
      height: 38px;
      font-size: 14px;
      font-weight: 500;
      background: #4361ee;
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.15s;
    }
    #run-btn:hover { background: #3a56d4; }
    #run-btn:active { transform: scale(0.97); }
    .err {
      font-size: 12px;
      color: #ff6b6b;
      margin-top: 8px;
      min-height: 16px;
    }
    .out-label {
      font-size: 13px;
      color: #8888aa;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    #output-box {
      width: 100%;
      resize: none;
      height: 72px;
      font-family: monospace;
      font-size: 13px;
      background: #0f3460;
      border: 1px solid #1a5276;
      border-radius: 8px;
      padding: 10px 12px;
      color: #a0ffb0;
      outline: none;
    }
    .copy-area {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .copy-badge {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 20px;
      background: #1a4d2e;
      color: #57e083;
      display: none;
    }
    .copy-badge.show { display: inline; }
    #copy-btn {
      font-size: 12px;
      color: #a0c4ff;
      background: none;
      border: 1px solid #1a5276;
      border-radius: 6px;
      padding: 3px 10px;
      cursor: pointer;
    }
    #copy-btn:hover { background: #0f3460; }
  </style>
</head>
<body>
  <div class="container">
    <h1>LOADSTRIBG FORMATTER BY YAJU</h1>

    <div class="card">
      <div class="label">スクリプトを入力（URLでも、そのままコードでもOK）</div>
      <div class="hint">このツールはURLの空白を消して整理するだけのものなので、そもそもURLが正しく無かったら意味ないです</div>
      <textarea id="url-input" placeholder='loadstring(game:HttpGet("https://example.com/script.lua"))()'></textarea>
      <div class="err" id="err-msg"></div>
      <button id="run-btn">実行</button>
    </div>

    <div class="card">
      <div class="out-label">
        <span>出力コード</span>
        <div class="copy-area">
          <span class="copy-badge" id="copy-badge">コピー済み ✓</span>
          <button id="copy-btn">コピー</button>
        </div>
      </div>
      <textarea id="output-box" readonly placeholder='ここに整形されたコードが表示されます'></textarea>
    </div>
  </div>

  <script>
    const urlInput = document.getElementById('url-input');
    const runBtn = document.getElementById('run-btn');
    const errMsg = document.getElementById('err-msg');
    const outputBox = document.getElementById('output-box');
    const copyBtn = document.getElementById('copy-btn');
    const copyBadge = document.getElementById('copy-badge');

    function extractUrl(raw) {
      const m = raw.match(/game\s*:\s*HttpGet\s*\(\s*["']([^"']+)["']\s*\)/i);
      if (m) return m[1].trim();

      const m2 = raw.match(/game\s*:\s*HttpGet\s*\(\s*([^)]+)\s*\)/i);
      if (m2) return m2[1].trim();

      return null;
    }

    function fixAndFormat(raw) {
      errMsg.textContent = '';
      let val = raw.trim();

      if (!val) {
        errMsg.textContent = 'URLまたはコードを入力してください。';
        return null;
      }

      if (/loadstring|HttpGet/i.test(val)) {
        const extracted = extractUrl(val);
        if (extracted) {
          val = extracted;
        } else {
          errMsg.textContent = 'コードからURLを取得できませんでした。URLだけ入力してみてください。';
          return null;
        }
      }

      val = val.replace(/\s+/g, '');

      if (!val.startsWith('http://') && !val.startsWith('https://')) {
        if (val.includes('.')) {
          val = 'https://' + val;
        } else {
          errMsg.textContent = 'URLが正しくありません。https://から始まるURLを入力してください。';
          return null;
        }
      }

      try {
        new URL(val);
      } catch {
        errMsg.textContent = '有効なURLではありません。確認してください。';
        return null;
      }

      return 'loadstring(game:HttpGet("' + val + '"))()';
    }

    function run() {
      const result = fixAndFormat(urlInput.value);
      if (result) {
        outputBox.value = result;
        copyToClipboard(result);
      } else {
        outputBox.value = '';
      }
    }

    function copyToClipboard(text) {
      navigator.clipboard.writeText(text).then(showBadge).catch(() => {
        outputBox.select();
        document.execCommand('copy');
        showBadge();
      });
    }

    function showBadge() {
      copyBadge.classList.add('show');
      setTimeout(() => copyBadge.classList.remove('show'), 2000);
    }

    runBtn.addEventListener('click', run);
    urlInput.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); run(); }
    });
    copyBtn.addEventListener('click', () => {
      if (outputBox.value) copyToClipboard(outputBox.value);
    });
  </script>
</body>
</html>
